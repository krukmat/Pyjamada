appId: com.krukmat.pyjamada
name: Android Screenshot Tour
tags:
  - android
  - screenshots
---
- launchApp:
    clearState: true

- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible:
              text: ".*isn't responding.*"
          commands:
            - tapOn: Wait
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: main-menu-screen
    timeout: 20000
- takeScreenshot:
    path: 01_main_menu

- tapOn:
    id: new-game-button
- extendedWaitUntil:
    visible:
      id: game-screen
    timeout: 20000
- assertVisible: GET DRESSED + FIND KEYS
- takeScreenshot:
    path: 02_run_start

- repeat:
    times: 2
    commands:
      - tapOn:
          id: move-left-button
- tapOn:
    id: action-button
- assertVisible: NORMAL
- takeScreenshot:
    path: 03_bed_wake

- repeat:
    times: 4
    commands:
      - tapOn:
          id: move-right-button
- tapOn:
    id: action-button
- assertVisible: "Stealth slippers equipped.*"
- takeScreenshot:
    path: 04_slippers

- repeat:
    times: 4
    commands:
      - tapOn:
          id: move-right-button
- tapOn:
    id: action-button
- assertVisible: "Awake instantly.*"
- takeScreenshot:
    path: 05_alarm

- tapOn:
    id: action-button
- assertVisible: "THE ALARM AGAIN.*"
- takeScreenshot:
    path: 06_startled

- repeat:
    times: 5
    commands:
      - tapOn:
          id: move-right-button
- tapOn:
    id: action-button
- assertVisible: "Dressed.*"
- takeScreenshot:
    path: 07_wardrobe

- repeat:
    times: 5
    commands:
      - tapOn:
          id: move-right-button
- tapOn:
    id: action-button
- assertVisible:
    id: restart-button
- assertVisible: "READY!.*"
- takeScreenshot:
    path: 08_success

- tapOn:
    id: restart-button
- assertVisible: GET DRESSED + FIND KEYS
- assertVisible: SLEEPY
- takeScreenshot:
    path: 09_restart
