appId: com.krukmat.pyjamada
name: Expressive Arcade Android Screenshot Tour
tags:
  - android
  - screenshots
  - expressive-arcade
---
- launchApp:
    clearState: true

- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible:
              text: ".*isn't responding.*"
          commands:
            - tapOn: Wait
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: main-menu-screen
    timeout: 20000
- assertVisible: PYJAMADA
- takeScreenshot:
    path: 01_main_menu

- tapOn:
    id: settings-button
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 10000
- assertVisible: SETTINGS
- takeScreenshot:
    path: 02_settings
- tapOn:
    id: settings-back-button
- extendedWaitUntil:
    visible:
      id: main-menu-screen
    timeout: 10000

- tapOn:
    id: new-game-button
- extendedWaitUntil:
    visible:
      id: game-screen
    timeout: 20000
- assertVisible: GET DRESSED + FIND KEYS
- assertVisible: "Wally is barely functional.*"
- takeScreenshot:
    path: 03_run_start_sleepy

- repeat:
    times: 2
    commands:
      - tapOn:
          id: move-left-button
- tapOn:
    id: action-button
- assertVisible: "Five more minutes.*"
- takeScreenshot:
    path: 04_bed_wake

- repeat:
    times: 4
    commands:
      - tapOn:
          id: move-right-button
- tapOn:
    id: action-button
- assertVisible: "Soft steps unlocked.*"
- takeScreenshot:
    path: 05_slippers

- repeat:
    times: 4
    commands:
      - tapOn:
          id: move-right-button
- tapOn:
    id: action-button
- assertVisible: "Awake. Quiet.*"
- takeScreenshot:
    path: 06_alarm

- tapOn:
    id: action-button
- assertVisible: "Again.*Panic mode engaged.*"
- takeScreenshot:
    path: 07_startled

- repeat:
    times: 5
    commands:
      - tapOn:
          id: move-right-button
- tapOn:
    id: action-button
- assertVisible: "Dressed. Coordination optional.*"
- takeScreenshot:
    path: 08_wardrobe_fumble

- repeat:
    times: 5
    commands:
      - tapOn:
          id: move-right-button
- tapOn:
    id: action-button
- extendedWaitUntil:
    visible:
      id: restart-button
    timeout: 10000
- assertVisible: "READY!.*"
- takeScreenshot:
    path: 09_success

- tapOn:
    id: restart-button
- assertVisible: GET DRESSED + FIND KEYS
- assertVisible: "Wally is barely functional.*"
- takeScreenshot:
    path: 10_restart

# Restore contract: persist a stable post-bed state, leave the game, then reconstruct
# presentation from gameplay state without persisting transient animation frames.
- repeat:
    times: 2
    commands:
      - tapOn:
          id: move-left-button
- tapOn:
    id: action-button
- assertVisible: "Five more minutes.*"
- tapOn:
    id: exit-button
- extendedWaitUntil:
    visible:
      id: main-menu-screen
    timeout: 10000
- tapOn:
    id: continue-button
- extendedWaitUntil:
    visible:
      id: game-screen
    timeout: 10000
- assertVisible: "Five more minutes.*"
- takeScreenshot:
    path: 11_continue_restore
