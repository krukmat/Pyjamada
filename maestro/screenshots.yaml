appId: com.krukmat.pyjamada
name: Haunted Arcade Android Screenshot Tour
tags:
  - android
  - screenshots
  - haunted-arcade
---
- launchApp:
    clearState: true

- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible:
              text: ".*isn't responding.*"
          commands:
            - tapOn: Wait
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: main-menu-screen
    timeout: 20000
- assertVisible: PYJAMADA
- takeScreenshot:
    path: 01_main_menu

- tapOn:
    id: settings-button
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 10000
- assertVisible: SETTINGS
- takeScreenshot:
    path: 02_settings
- tapOn:
    id: settings-back-button
- extendedWaitUntil:
    visible:
      id: main-menu-screen
    timeout: 10000

# Screenshot builds expose a transparent test-only hotspot in the bottom-right
# corner. It opens a scenario picker, then disappears completely after a
# selection so the screenshots contain only player-facing UI. Scenarios are
# deterministic and frozen: this tour reviews rendering, composition and
# gameplay readability without racing the real-time simulation.

- tapOn:
    id: screenshot-scenario-menu
- extendedWaitUntil:
    visible:
      id: screenshot-scenario-picker
    timeout: 5000
- tapOn:
    id: screenshot-scenario-sleepy
- extendedWaitUntil:
    visible:
      id: game-screen
    timeout: 5000
- assertVisible: "Wake up first. Bed or alarm."
- takeScreenshot:
    path: 03_haunted_sleepy

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-wake
- assertVisible: "Awake. The room is waking up too."
- takeScreenshot:
    path: 04_haunted_wake

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-ghost-telegraph
- assertVisible: "Something is phasing into the room..."
- takeScreenshot:
    path: 05_ghost_telegraph

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-ghost-active
- assertVisible: "Ghost active. Shoot or keep moving."
- takeScreenshot:
    path: 06_ghost_active

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-jump
- assertVisible: HAUNTED MORNING
- takeScreenshot:
    path: 07_wally_jump

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-attack
- assertVisible: "Ghost active. Shoot or keep moving."
- takeScreenshot:
    path: 08_dream_spark_attack

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-ghost-defeated
- assertVisible: HAUNTED MORNING
- takeScreenshot:
    path: 09_ghost_defeated

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-hit
- assertVisible: "HP ♥♥·"
- takeScreenshot:
    path: 10_player_hit

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-dressed
- assertVisible: "Ghost active. Shoot or keep moving."
- takeScreenshot:
    path: 11_dressed_under_pressure

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-escape-ready
- assertVisible: "ESCAPE READY · CLEAR THE DOOR"
- assertVisible: "Exit lane haunted. Fire, dodge, get out."
- takeScreenshot:
    path: 12_escape_ready

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-success
- extendedWaitUntil:
    visible:
      id: restart-button
    timeout: 5000
- assertVisible: "ESCAPED!"
- assertVisible: "Out. Barely."
- takeScreenshot:
    path: 13_escaped

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-haunted-fail
- extendedWaitUntil:
    visible:
      id: restart-button
    timeout: 5000
- assertVisible: "HAUNTED!"
- assertVisible: "The haunting got Wally."
- takeScreenshot:
    path: 14_haunted_failure
