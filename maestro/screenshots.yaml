appId: com.krukmat.pyjamada
name: Android Screenshot Tour
tags:
  - android
  - screenshots
---
- launchApp:
    clearState: true

- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible:
              text: ".*isn't responding.*"
          commands:
            - tapOn: Wait
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: main-menu-screen
    timeout: 20000
- takeScreenshot:
    path: 01_main_menu

- tapOn:
    id: settings-button
- assertVisible:
    id: settings-screen
- takeScreenshot:
    path: 02_settings
- tapOn:
    id: settings-back-button

- assertVisible:
    id: main-menu-screen
- tapOn:
    id: new-game-button
- extendedWaitUntil:
    visible:
      text: BEDROOM
    timeout: 20000
- takeScreenshot:
    path: 03_bedroom

- repeat:
    times: 5
    commands:
      - tapOn:
          id: move-right-button
- assertVisible: KEY
- takeScreenshot:
    path: 04_bedroom_key_collected

- repeat:
    times: 10
    commands:
      - tapOn:
          id: move-right-button
- tapOn:
    id: action-button
- assertVisible: EMPTY
- takeScreenshot:
    path: 05_bedroom_door_open

- repeat:
    times: 7
    commands:
      - tapOn:
          id: move-right-button
- assertVisible: HALL
- takeScreenshot:
    path: 06_hall

- repeat:
    times: 26
    commands:
      - tapOn:
          id: move-right-button
- extendedWaitUntil:
    visible: Vertical slice reached
    timeout: 10000
- tapOn: OK
- assertVisible: LANDING
- takeScreenshot:
    path: 07_landing
