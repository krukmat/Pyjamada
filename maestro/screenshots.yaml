appId: com.krukmat.pyjamada
name: Haunted House Android Screenshot Tour
tags:
  - android
  - screenshots
  - haunted-house
---
- launchApp:
    clearState: true

- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible:
              text: ".*isn't responding.*"
          commands:
            - tapOn: Wait
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: main-menu-screen
    timeout: 20000
- assertVisible: PYJAMADA
- takeScreenshot:
    path: 01_main_menu

- tapOn:
    id: settings-button
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 10000
- assertVisible: SETTINGS
- takeScreenshot:
    path: 02_settings
- tapOn:
    id: settings-back-button
- extendedWaitUntil:
    visible:
      id: main-menu-screen
    timeout: 10000

# Screenshot builds expose a test-only scenario picker. Haunted actor rendering
# has synchronous Skia fallbacks, so the tour waits on actual scenario UI state
# instead of a synthetic renderer-ready probe.

- tapOn:
    id: screenshot-scenario-menu
- extendedWaitUntil:
    visible:
      id: screenshot-scenario-picker
    timeout: 5000
- tapOn:
    id: screenshot-scenario-sleepy
- extendedWaitUntil:
    visible:
      text: "Wake up first. Bed or alarm."
    timeout: 5000
- takeScreenshot:
    path: 03_haunted_sleepy

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-wake
- extendedWaitUntil:
    visible:
      text: "Awake. The room is waking up too."
    timeout: 5000
- takeScreenshot:
    path: 04_haunted_wake

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-ghost-telegraph
- extendedWaitUntil:
    visible:
      text: "Something is phasing into the room..."
    timeout: 5000
- takeScreenshot:
    path: 05_ghost_telegraph

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-ghost-active
- extendedWaitUntil:
    visible:
      text: "Ghost active. Shoot or keep moving."
    timeout: 5000
- takeScreenshot:
    path: 06_ghost_active

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-jump
- extendedWaitUntil:
    visible:
      id: game-screen
    timeout: 5000
- assertVisible: HAUNTED MORNING
- takeScreenshot:
    path: 07_wally_jump

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-attack
- extendedWaitUntil:
    visible:
      text: "Ghost active. Shoot or keep moving."
    timeout: 5000
- takeScreenshot:
    path: 08_dream_spark_attack

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-ghost-defeated
- extendedWaitUntil:
    visible:
      id: game-screen
    timeout: 5000
- assertVisible: HAUNTED MORNING
- takeScreenshot:
    path: 09_ghost_defeated

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-hit
- extendedWaitUntil:
    visible:
      text: "HP ♥♥·"
    timeout: 5000
- takeScreenshot:
    path: 10_player_hit

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-dressed
- extendedWaitUntil:
    visible:
      text: "Ghost active. Shoot or keep moving."
    timeout: 5000
- takeScreenshot:
    path: 11_dressed_under_pressure

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-escape-ready
- extendedWaitUntil:
    visible:
      text: "ESCAPE READY · CLEAR THE DOOR"
    timeout: 5000
- assertVisible: "Exit lane haunted. Fire, dodge, get out."
- takeScreenshot:
    path: 12_escape_ready

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-success
- extendedWaitUntil:
    visible:
      id: restart-button
    timeout: 5000
- assertVisible: "ESCAPED!"
- assertVisible: "Out. Barely."
- takeScreenshot:
    path: 13_escaped

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-haunted-fail
- extendedWaitUntil:
    visible:
      id: restart-button
    timeout: 5000
- assertVisible: "HAUNTED!"
- assertVisible: "The haunting got Wally."
- takeScreenshot:
    path: 14_haunted_failure

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-altered-bedroom
- extendedWaitUntil:
    visible:
      text: "That door did not lead outside. The room is wrong."
    timeout: 5000
- assertVisible: "FIND ANOTHER WAY OUT"
- takeScreenshot:
    path: 15_altered_bedroom

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-hallway-arrival
- extendedWaitUntil:
    visible:
      text: "This hallway feels longer than it should."
    timeout: 5000
- assertVisible: "CHECK THE HALLWAY"
- takeScreenshot:
    path: 16_hallway_arrival

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-hallway-clock
- extendedWaitUntil:
    visible:
      text: "The clock runs backward. A door at the far end just clicked."
    timeout: 5000
- assertVisible: "ENTER THE LIVING ROOM"
- takeScreenshot:
    path: 17_hallway_clock

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-living-door
- extendedWaitUntil:
    visible:
      text: "The clock runs backward. A door at the far end just clicked."
    timeout: 5000
- assertVisible: "ENTER THE LIVING ROOM"
- assertVisible: "INTERACT · LIVING ROOM"
- takeScreenshot:
    path: 18_living_room_door

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-living-room-arrival
- extendedWaitUntil:
    visible:
      text: "The television is dark. The room is listening."
    timeout: 5000
- assertVisible: "HAUNTED HOUSE · LIVING ROOM"
- assertVisible: "CHECK THE LIVING ROOM"
- takeScreenshot:
    path: 19_living_room_arrival

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-living-room-static
- extendedWaitUntil:
    visible:
      text: "Static. Not a channel. Something is underneath it."
    timeout: 5000
- assertVisible: "CHECK THE SIGNAL"
- assertVisible: "INTERACT · TELEVISION"
- takeScreenshot:
    path: 20_living_room_static

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-living-room-transmission
- extendedWaitUntil:
    visible:
      text: "A voice cuts through: RESONANCE STABLE... SUBJECT... Then static."
    timeout: 5000
- assertVisible: "FIND THE SOURCE"
- assertVisible: "INTERACT · TELEVISION"
- takeScreenshot:
    path: 21_lab_transmission

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-living-room-source-cue
- extendedWaitUntil:
    visible:
      text: "The radio catches the same pulse. Stronger through the wall."
    timeout: 5000
- assertVisible: "FIND THE SOURCE"
- assertVisible: "INTERACT · RADIO"
- takeScreenshot:
    path: 22_living_room_source_cue

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-kitchen-arrival
- extendedWaitUntil:
    visible:
      text: "The appliances are dead. Something in the wall is still drawing power."
    timeout: 5000
- assertVisible: "HAUNTED HOUSE · KITCHEN"
- assertVisible: "TRACE THE POWER"
- takeScreenshot:
    path: 23_kitchen_arrival

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-kitchen-overload
- extendedWaitUntil:
    visible:
      text: "The microwave killed the lights. The breaker is buzzing now."
    timeout: 5000
- assertVisible: "CHECK THE BREAKER"
- assertVisible: "INTERACT · BREAKER"
- takeScreenshot:
    path: 24_kitchen_overload

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-kitchen-power-rerouted
- extendedWaitUntil:
    visible:
      text: "The circuit settles. The same pulse is moving deeper into the house."
    timeout: 5000
- assertVisible: "FOLLOW THE PULSE"
- assertVisible: "INTERACT · BATHROOM"
- takeScreenshot:
    path: 25_kitchen_power_rerouted

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-bathroom-arrival
- extendedWaitUntil:
    visible:
      text: "The pulse stops at the sink."
    timeout: 5000
- assertVisible: "HAUNTED HOUSE · BATHROOM"
- assertVisible: "FOLLOW THE PULSE"
- takeScreenshot:
    path: 26_bathroom_arrival

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-bathroom-mirror-mismatch
- extendedWaitUntil:
    visible:
      text: "The pulse stops here. In the mirror, it keeps going."
    timeout: 5000
- assertVisible: "TEST THE REFLECTION"
- assertVisible: "INTERACT · MIRROR"
- takeScreenshot:
    path: 27_bathroom_mirror_mismatch

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-bathroom-reflected-route
- extendedWaitUntil:
    visible:
      text: "The room went dark. The reflection did not."
    timeout: 5000
- assertVisible: "CHECK THE MIRROR"
- assertVisible: "INTERACT · MIRROR"
- takeScreenshot:
    path: 28_bathroom_reflected_route

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-bathroom-route-revealed
- extendedWaitUntil:
    visible:
      text: "The wall is copying the mirror. A hidden stair climbs behind it."
    timeout: 5000
- assertVisible: "ATTIC ACCESS REVEALED"
- assertVisible: "INTERACT · ATTIC"
- takeScreenshot:
    path: 29_bathroom_route_revealed

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-attic-arrival
- extendedWaitUntil:
    visible:
      text: "Old storage. New cables. Someone turned the attic into an observation post."
    timeout: 5000
- assertVisible: "HAUNTED HOUSE · ATTIC"
- assertVisible: "SEARCH THE ATTIC"
- takeScreenshot:
    path: 30_attic_arrival

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-attic-evidence
- extendedWaitUntil:
    visible:
      text: "Bedroom. Television. Power. Mirror. The readings all belong to the same experiment."
    timeout: 5000
- assertVisible: "PLAY THE RECORDING"
- assertVisible: "INTERACT · SENSOR CRATE"
- takeScreenshot:
    path: 31_attic_evidence

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-attic-recording
- extendedWaitUntil:
    visible:
      text: "SUBJECT W-01. RESONANCE EXTRACTION. This house is an experiment."
    timeout: 5000
- assertVisible: "FIND THE MACHINE"
- assertVisible: "INTERACT · RECORDER"
- takeScreenshot:
    path: 32_attic_recording

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-attic-basement-route
- extendedWaitUntil:
    visible:
      text: "The recorder output drops through the floor. The machine is below."
    timeout: 5000
- assertVisible: "FIND THE MACHINE"
- assertVisible: "INTERACT · DOWNWARD CABLE"
- takeScreenshot:
    path: 33_basement_route_revealed

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-basement-arrival
- extendedWaitUntil:
    visible:
      text: "The Attic cable ends here, grafted into the house utilities."
    timeout: 5000
- assertVisible: "HAUNTED HOUSE · BASEMENT"
- assertVisible: "FOLLOW THE POWER"
- takeScreenshot:
    path: 34_basement_arrival

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-basement-power-fault
- extendedWaitUntil:
    visible:
      text: "The cyan feed is arcing into the old utility line. The relay can isolate it."
    timeout: 5000
- assertVisible: "ISOLATE THE FAULT"
- assertVisible: "INTERACT · ISOLATION RELAY"
- takeScreenshot:
    path: 35_basement_power_fault

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-basement-control-reveal
- extendedWaitUntil:
    visible:
      text: "Resonance load is above the safe line. The system is still climbing."
    timeout: 5000
- assertVisible: "TRIP THE FAILSAFE"
- assertVisible: "INTERACT · CONTROL TERMINAL"
- takeScreenshot:
    path: 36_basement_control_reveal

- tapOn:
    id: screenshot-scenario-menu
- tapOn:
    id: screenshot-scenario-laboratory-boundary
- extendedWaitUntil:
    visible:
      text: "The feed disappears through a service hatch. The Laboratory is below."
    timeout: 5000
- assertVisible: "LABORATORY ROUTE IDENTIFIED"
- assertVisible: "INTERACT · LABORATORY"
- takeScreenshot:
    path: 37_laboratory_boundary
