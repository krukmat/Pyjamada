appId: com.krukmat.pyjamada
name: Systemic Android Screenshot Tour
tags:
  - android
  - systemic
  - screenshots
---
- launchApp:
    clearState: true

- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible:
              text: ".*isn't responding.*"
          commands:
            - tapOn: Wait
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: main-menu-screen
    timeout: 20000
- takeScreenshot:
    path: 01_systemic_menu

- tapOn:
    id: systemic-prototype-button
- extendedWaitUntil:
    visible:
      id: systemic-game-screen
    timeout: 20000
- assertVisible: GET DRESSED + FIND KEYS
- takeScreenshot:
    path: 02_systemic_run_start

# Wake Wally with the bed: x=24 -> x=16.
- repeat:
    times: 2
    commands:
      - tapOn:
          id: systemic-move-left-button
- tapOn:
    id: systemic-action-button
- assertVisible: NORMAL
- takeScreenshot:
    path: 03_systemic_bed_wake

# Equip slippers and expose the movement/noise modifier visually.
- repeat:
    times: 4
    commands:
      - tapOn:
          id: systemic-move-right-button
- tapOn:
    id: systemic-action-button
- assertVisible: "Stealth slippers equipped.*"
- takeScreenshot:
    path: 04_systemic_slippers

# First alarm interaction: noticeable noise, Wally still composed.
- repeat:
    times: 4
    commands:
      - tapOn:
          id: systemic-move-right-button
- tapOn:
    id: systemic-action-button
- assertVisible: "Awake instantly.*"
- takeScreenshot:
    path: 05_systemic_alarm

# Repeating the alarm moves Wally into the startled state and exposes a rule trace.
- tapOn:
    id: systemic-action-button
- assertVisible: "THE ALARM AGAIN.*"
- takeScreenshot:
    path: 06_systemic_startled

# Get dressed while startled; this demonstrates chained consequences.
- repeat:
    times: 5
    commands:
      - tapOn:
          id: systemic-move-right-button
- tapOn:
    id: systemic-action-button
- assertVisible: "Dressed.*"
- takeScreenshot:
    path: 07_systemic_wardrobe

# Collect keys. Dressed + keys completes the objective before the noise limit.
- repeat:
    times: 5
    commands:
      - tapOn:
          id: systemic-move-right-button
- tapOn:
    id: systemic-action-button
- assertVisible:
    id: systemic-restart-button
- assertVisible: "READY!.*"
- takeScreenshot:
    path: 08_systemic_success

# Restart proves the run returns to the exact visual baseline.
- tapOn:
    id: systemic-restart-button
- assertVisible: GET DRESSED + FIND KEYS
- assertVisible: SLEEPY
- takeScreenshot:
    path: 09_systemic_restart
