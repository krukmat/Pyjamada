appId: com.krukmat.pyjamada
name: DEMO film - the QA bot plays one real run
tags:
  - android
  - demo
# Who plays and on which level: override with -e DEMO_PLAYER=casual|average|expert
# and -e DEMO_LEVEL=1|2|3 (npm run demo:film -- --player casual --level 3).
env:
  DEMO_PLAYER: average
  DEMO_LEVEL: '2'
---
# Run through scripts/demo-film.sh (npm run demo:film), which records the
# screen to video around this flow. Needs no test hooks: the hidden DEMO entry is in every build.
- launchApp
- extendedWaitUntil:
    visible:
      id: main-menu-screen
    timeout: 20000
# The DEMO has no menu button for players: a long press on the title opens it.
- longPressOn:
    id: demo-hidden-entry
- tapOn:
    id: demo-player-${DEMO_PLAYER}
- tapOn:
    id: demo-level-${DEMO_LEVEL}
- tapOn:
    id: demo-start
- extendedWaitUntil:
    visible:
      id: demo-banner
    timeout: 10000
- evalScript: ${output.last = ''}
# One still per new numbered moment (start, room entry, hit, down, retry,
# ending) until the run ends and the DEMO banner goes away.
- repeat:
    while:
      visible:
        id: demo-banner
    times: 3000
    commands:
      - copyTextFrom:
          id: demo-moment
          optional: true
      - runFlow:
          when:
            true: ${maestro.copiedText && maestro.copiedText != output.last}
          commands:
            - takeScreenshot:
                path: ${maestro.copiedText.replace(/[^A-Za-z0-9]+/g, '_')}
            - evalScript: ${output.last = maestro.copiedText}
